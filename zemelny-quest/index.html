<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Земельный Квест</title>
<style>
  :root {
    --soil-dark: #3b2a1a;
    --soil: #6b4a2f;
    --soil-light: #9c7248;
    --grass: #4a7c3a;
    --grass-light: #6fae52;
    --paper: #f6ecd9;
    --ink: #2b2016;
    --accent: #c0392b;
    --gold: #d4a017;
    --ok: #2e7d32;
    --bad: #b71c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 8px),
      linear-gradient(180deg, var(--soil-light), var(--soil) 40%, var(--soil-dark));
    background-attachment: fixed;
    padding-bottom: 40px;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 16px; }

  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    background: var(--paper);
    border: 3px solid var(--soil-dark);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 16px;
  }
  header.topbar h1 {
    font-size: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: bold; }
  .hearts span { opacity: 1; }
  .hearts .empty { opacity: 0.25; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: bold;
  }
  .btn-primary { background: var(--grass); color: #fff; }
  .btn-primary:hover { background: var(--grass-light); }
  .btn-danger { background: transparent; color: var(--paper); border: 1px solid var(--paper); }
  .btn-small { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { background: transparent; border: 2px solid var(--soil-dark); color: var(--soil-dark); }

  .card {
    background: var(--paper);
    border: 3px solid var(--soil-dark);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .intro-card p { line-height: 1.5; }

  .loc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .loc-tile {
    background: var(--paper);
    border: 3px solid var(--soil-dark);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .loc-tile:hover:not(.locked) { transform: translateY(-3px); }
  .loc-tile.locked { opacity: 0.5; cursor: not-allowed; }
  .loc-tile.completed { border-color: var(--ok); }
  .loc-tile .icon { font-size: 36px; }
  .loc-tile .name { font-weight: bold; margin: 6px 0 2px; }
  .loc-tile .tag { font-size: 12px; color: var(--soil); }
  .boss-badge { color: var(--accent); font-weight: bold; }

  .exam-tile {
    background: linear-gradient(135deg, #4a1c1c, #7a2b2b);
    color: #fff;
    border-color: var(--gold);
  }
  .exam-tile.locked { opacity: 0.4; }

  .dialog {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .dialog img.avatar {
    width: 96px;
    height: 96px;
    object-fit: cover;
    object-position: top center;
    border-radius: 50%;
    border: 3px solid var(--soil-dark);
    flex-shrink: 0;
    background: #ddd;
  }
  .speech {
    background: #fff;
    border: 2px solid var(--soil-dark);
    border-radius: 10px;
    padding: 12px 14px;
    position: relative;
    flex: 1;
  }
  .speech::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 20px;
    border-width: 8px 10px 8px 0;
    border-style: solid;
    border-color: transparent var(--soil-dark) transparent transparent;
  }
  .speech .situation { font-style: italic; margin-bottom: 8px; color: #444; }
  .speech .question { font-weight: bold; }

  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .option-btn {
    text-align: left;
    background: #fff;
    border: 2px solid var(--soil);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 8px;
  }
  .option-btn:hover { background: #fff6e0; border-color: var(--gold); }
  .option-btn:disabled { cursor: default; opacity: 0.7; }

  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 2px solid;
  }
  .feedback.correct { background: #e8f5e9; border-color: var(--ok); }
  .feedback.wrong { background: #fdecea; border-color: var(--bad); }
  .feedback .explain { margin-top: 6px; font-size: 14px; color: #333; }
  .feedback .notice { margin-top: 6px; font-size: 13px; color: var(--accent); font-weight: bold; }

  .boss-header {
    background: linear-gradient(135deg, #4a1c1c, #7a2b2b);
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-bar > div { height: 100%; background: var(--grass); }

  .inventory { margin-top: 20px; }
  .inventory h2 { font-size: 16px; color: var(--paper); }
  .inv-cards { display: flex; flex-wrap: wrap; gap: 10px; }
  .inv-card {
    background: var(--paper);
    border: 2px dashed var(--gold);
    border-radius: 8px;
    padding: 8px 10px;
    max-width: 220px;
    font-size: 13px;
  }
  .inv-card b { display: block; margin-bottom: 4px; color: var(--soil-dark); }
  .empty-note { color: var(--paper); opacity: 0.7; font-size: 13px; }

  .diploma {
    text-align: center;
    padding: 20px;
  }
  .diploma .big-emoji { font-size: 56px; }
  .row-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  footer.foot { text-align: center; color: var(--paper); opacity: 0.6; font-size: 12px; margin-top: 24px; }
</style>
</head>

/* ===================== СОСТОЯНИЕ ===================== */
function defaultState() {
  return {
    reputation: 0,
    lives: MAX_LIVES,
    unlocked: [GAME_DATA.locations[0].id],
    completed: [],
    inventory: [],
    examPassed: false
  };
}

let persist = loadSave();
let session = {
  screen: "hub",
  currentLocationId: null,
  qIndex: 0,
  attemptScore: 0,
  bossSetIndex: 0,
  bossLives: BOSS_LIVES,
  feedback: null,
  examQuestions: [],
  examIndex: 0,
  examScore: 0,
  examFeedback: null
};

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch (e) {
    return defaultState();
  }
}
function save() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(persist));
}

function getLocation(id) { return GAME_DATA.locations.find(l => l.id === id); }
function locationIndex(id) { return GAME_DATA.locations.findIndex(l => l.id === id); }
function isUnlocked(id) { return persist.unlocked.includes(id); }
function isCompleted(id) { return persist.completed.includes(id); }
function randomReaction() { return GAME_DATA.correctReactions[Math.floor(Math.random() * GAME_DATA.correctReactions.length)]; }

function addHint(hintId) {
  if (hintId && !persist.inventory.includes(hintId)) persist.inventory.push(hintId);
}

function completeLocation(loc) {
  persist.reputation += session.attemptScore;
  if (!persist.completed.includes(loc.id)) persist.completed.push(loc.id);
  addHint(loc.hint.id);
  const idx = locationIndex(loc.id);
  const next = GAME_DATA.locations[idx + 1];
  if (next && !persist.unlocked.includes(next.id)) persist.unlocked.push(next.id);
  save();
}

/* ===================== ДЕЙСТВИЯ: ОБЫЧНАЯ ЛОКАЦИЯ ===================== */
function startLocation(id) {
  if (!isUnlocked(id)) return;
  session.screen = "location";
  session.currentLocationId = id;
  session.qIndex = 0;
  session.attemptScore = 0;
  session.feedback = null;
  render();
}

function answerLocation(idx) {
  const loc = getLocation(session.currentLocationId);
  const q = loc.questions[session.qIndex];
  if (idx === q.correct) {
    session.attemptScore += 10;
    addHint(q.hintId);
    session.feedback = { correct: true, text: randomReaction(), explanation: q.explanation, finished: session.qIndex === loc.questions.length - 1 };
  } else {
    persist.lives -= 1;
    let resetNotice = null;
    if (persist.lives <= 0) {
      persist.lives = MAX_LIVES;
      session.qIndex = -1; // will be set to 0 by nextLocationStep via "restart"
      session.attemptScore = 0;
      resetNotice = "Жизни закончились. Тема начинается заново — соберитесь.";
    }
    save();
    session.feedback = { correct: false, text: q.wrong[idx] || "Мимо темы. Ещё раз.", resetNotice, restart: persist.lives === MAX_LIVES && resetNotice };
  }
  render();
}

function nextLocationStep() {
  const loc = getLocation(session.currentLocationId);
  if (session.feedback && session.feedback.correct) {
    if (session.qIndex >= loc.questions.length - 1) {
      completeLocation(loc);
      session.screen = "hub";
      session.currentLocationId = null;
      session.feedback = null;
      render();
      return;
    }
    session.qIndex += 1;
  } else if (session.feedback && session.feedback.resetNotice) {
    session.qIndex = 0;
  }
  session.feedback = null;
  render();
}

/* ===================== ДЕЙСТВИЯ: БОСС (АРЕНДА) ===================== */
function startBoss(id) {
  if (!isUnlocked(id)) return;
  session.screen = "boss";
  session.currentLocationId = id;
  session.qIndex = 0;
  session.attemptScore = 0;
  session.bossSetIndex = 0;
  session.bossLives = BOSS_LIVES;
  session.feedback = null;
  render();
}

function currentBossSet(loc) { return loc.questionSets[session.bossSetIndex % loc.questionSets.length]; }

function answerBoss(idx) {
  const loc = getLocation(session.currentLocationId);
  const set = currentBossSet(loc);
  const q = set[session.qIndex];
  if (idx === q.correct) {
    session.attemptScore += 15;
    addHint(q.hintId);
    session.feedback = { correct: true, text: randomReaction(), explanation: q.explanation, finished: session.qIndex === set.length - 1 };
  } else {
    session.bossLives -= 1;
    if (session.bossLives <= 0) {
      session.feedback = { correct: false, text: q.wrong[idx] || "Мимо темы. Ещё раз.", restartSeries: true };
    } else {
      session.feedback = { correct: false, text: q.wrong[idx] || "Мимо темы. Ещё раз." };
    }
  }
  render();
}

function nextBossStep() {
  const loc = getLocation(session.currentLocationId);
  if (session.feedback && session.feedback.correct) {
    const set = currentBossSet(loc);
    if (session.qIndex >= set.length - 1) {
      completeLocation(loc);
      session.screen = "hub";
      session.currentLocationId = null;
      session.feedback = null;
      render();
      return;
    }
    session.qIndex += 1;
  } else if (session.feedback && session.feedback.restartSeries) {
    session.qIndex = 0;
    session.attemptScore = 0;
    session.bossLives = BOSS_LIVES;
    session.bossSetIndex += 1;
  }
  session.feedback = null;
  render();
}

/* ===================== ФИНАЛЬНЫЙ ЭКЗАМЕН ===================== */
function collectAllQuestionsFromCompleted() {
  const pool = [];
  persist.completed.forEach(id => {
    const loc = getLocation(id);
    if (!loc) return;
    if (loc.boss) {
      loc.questionSets[0].forEach(q => pool.push(q));
    } else {
      loc.questions.forEach(q => pool.push(q));
    }
  });
  return pool.filter(q => q.question !== GAME_DATA.finalQuestion49.question);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startExam() {
  if (persist.completed.length < GAME_DATA.locations.length) return;
  const pool = shuffle(collectAllQuestionsFromCompleted());
  const picked = pool.slice(0, Math.min(7, pool.length));
  const withMandatory = shuffle([...picked, GAME_DATA.finalQuestion49]);
  session.screen = "exam";
  session.examQuestions = withMandatory;
  session.examIndex = 0;
  session.examScore = 0;
  session.examFeedback = null;
  render();
}

function answerExam(idx) {
  const q = session.examQuestions[session.examIndex];
  const correct = idx === q.correct;
  if (correct) {
    session.examScore += 1;
    addHint(q.hintId);
    save();
  }
  session.examFeedback = { correct, text: correct ? randomReaction() : (q.wrong[idx] || "Мимо."), explanation: q.explanation };
  render();
}

function nextExamStep() {
  if (session.examIndex >= session.examQuestions.length - 1) {
    const total = session.examQuestions.length;
    const passed = session.examScore / total >= 0.6;
    if (passed) {
      persist.examPassed = true;
      persist.reputation += 50;
      save();
    }
    session.screen = "diploma";
    session.examResult = { passed, score: session.examScore, total };
    session.examFeedback = null;
    render();
    return;
  }
  session.examIndex += 1;
  session.examFeedback = null;
  render();
}

/* ===================== СБРОС ===================== */
function resetProgress() {
  if (!confirm("Точно сбросить весь прогресс «Земельного квеста»?")) return;
  persist = defaultState();
  save();
  session = { screen: "hub", currentLocationId: null, qIndex: 0, attemptScore: 0, bossSetIndex: 0, bossLives: BOSS_LIVES, feedback: null, examQuestions: [], examIndex: 0, examScore: 0, examFeedback: null };
  render();
}

function backToHub() {
  session.screen = "hub";
  session.currentLocationId = null;
  session.feedback = null;
  render();
}

        <div class="name">${loc.title}</div>

          <div>${session.examFeedback.text}</div>
          <div class="explain">${session.examFeedback.explanation}</div>
          <div style="margin-top:10px;"><button class="btn-primary" id="nextBtn">${session.examIndex >= session.examQuestions.length - 1 ? "Узнать результат" : "Следующий вопрос"}</button></div>
        </div>` : ""}
    </div>
  `;

  if (!disabled) {
    app.querySelectorAll(".option-btn").forEach(btn => btn.addEventListener("click", () => answerExam(parseInt(btn.dataset.idx))));
  }
  const nextBtn = app.querySelector("#nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", nextExamStep);
  bindHeader();
}

function renderDiploma() {
  const r = session.examResult;
  app.innerHTML = `
    ${headerHtml()}
    <div class="card diploma">
      <div class="big-emoji">${r.passed ? "🎓" : "📛"}</div>
      <h2>${r.passed ? "Экзамен сдан!" : "Экзамен не сдан"}</h2>
      <div class="dialog" style="text-align:left; margin-top:10px;">
        <img class="avatar" src="${ZEMLEKOP_IMG}" alt="Землекоп">
        <div class="speech">
          <div class="question">${r.passed
            ? `Результат: ${r.score} из ${r.total}. Не идеально, но диплом вы честно заслужили. Не забывайте: 49, а не 50.`
            : `Результат: ${r.score} из ${r.total}. Маловато. Пересдача — она же попытка номер два — открыта в любое время.`}</div>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn-primary" id="hubBtn">К карте тем</button>
        ${!r.passed ? '<button class="btn-ghost" id="retryExamBtn">Пересдать экзамен</button>' : ""}
      </div>
    </div>
    ${inventoryHtml()}
  `;
  app.querySelector("#hubBtn").addEventListener("click", backToHub);
  const retryBtn = app.querySelector("#retryExamBtn");
  if (retryBtn) retryBtn.addEventListener("click", startExam);
  bindHeader();
}

function render() {
  if (session.screen === "hub") renderHub();
  else if (session.screen === "location") renderLocation();
  else if (session.screen === "boss") renderBoss();
  else if (session.screen === "exam") renderExam();
  else if (session.screen === "diploma") renderDiploma();
}

render();
</script>
</body>
</html>
